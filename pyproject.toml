[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surf-cli"
version = "0.5.0"
description = "Extract markdown sections by heading with Obsidian link support"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexander R. Saint Croix", email = "alex@saintx.us" }]
requires-python = ">=3.12"
dependencies = ["pypdf>=5.0.0"]

[project.urls]
Homepage = "https://github.com/saintx/surf-cli"
Repository = "https://github.com/saintx/surf-cli"
Issues = "https://github.com/saintx/surf-cli/issues"
Author = "https://github.com/saintx"

[project.scripts]
surf = "surf.orchestrator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/surf"]
exclude = ["src/surf/test_*.py"]

[tool.pytest.ini_options]
testpaths = ["src/surf"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "black>=25.1.0",
    "import-linter>=2.0",
    "isort>=6.0.1",
    "pyright>=1.1.407",
    "pytest>=9.1.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pyright]
pythonVersion = "3.12"
reportMissingParameterType = "warning"
reportUnusedImport = "error"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[tool.importlinter]
root_package = "surf"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Models cannot import higher layers"
source_modules = ["surf.models"]
forbidden_modules = ["surf.logic", "surf.adapters", "surf.orchestrator"]
type = "forbidden"

[[tool.importlinter.contracts]]
name = "Logic cannot import adapters or orchestrator"
source_modules = ["surf.logic"]
forbidden_modules = ["surf.adapters", "surf.orchestrator"]
type = "forbidden"

[[tool.importlinter.contracts]]
name = "Adapters cannot import logic or orchestrator"
source_modules = ["surf.adapters"]
forbidden_modules = ["surf.logic", "surf.orchestrator"]
type = "forbidden"

[[tool.importlinter.contracts]]
name = "Models, logic, and orchestrator cannot import pypdf"
source_modules = ["surf.models", "surf.logic", "surf.orchestrator"]
forbidden_modules = ["pypdf"]
type = "forbidden"
allow_indirect_imports = true
